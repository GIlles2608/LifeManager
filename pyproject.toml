[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemanager"
version = "0.1.0"
description = "Personal life & finance manager — desktop app"
requires-python = ">=3.14"
dependencies = [
    "PyQt6>=6.6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",   # PostgreSQL driver
    "python-dotenv>=1.0",
    "requests>=2.31",          # Open Food Facts API
    "babel>=2.14",             # currency / locale formatting
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.7",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
lifemanager = "lifemanager.__main__:main"

[tool.setuptools.packages.find]
include = ["lifemanager*"]
exclude = ["assets*", "migrations*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lifemanager --cov-report=term-missing -q"
